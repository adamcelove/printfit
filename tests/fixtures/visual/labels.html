<!doctype html>
<html><head><meta charset="utf-8"><title>labels</title>
<style>
@page { size: letter; margin: 0.5in; }
body { margin: 0; font-family: Helvetica, Arial, sans-serif; font-size: 11pt; }
svg { display: block; width: 400px; height: 120px; margin: 0 0 12px 0; }
text { font-size: 14px; font-family: Helvetica, Arial, sans-serif; }
.vec { stroke: #111; stroke-width: 2.4; fill: none; stroke-linecap: butt; }
.gl { stroke: #999; stroke-width: 1; }
</style></head><body>
<svg width="0" height="0" style="position:absolute; width:0; height:0; margin:0"><defs>
  <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#111"/></marker>
</defs></svg>
<svg class="f-tt-overlap" viewBox="0 0 400 120"><text x="40" y="60">Fnet</text><text x="52" y="62">Fg</text></svg>
<svg class="f-tt-clear" viewBox="0 0 400 120"><text x="40" y="60">Fnet</text><text x="120" y="60">Fg</text></svg>
<svg class="f-line-through" viewBox="0 0 400 120"><line class="vec" x1="20" y1="55" x2="300" y2="55"/><text x="100" y="60">v</text></svg>
<svg class="f-line-clear" viewBox="0 0 400 120"><line class="vec" x1="20" y1="75" x2="300" y2="75"/><text x="100" y="60">v</text></svg>
<svg class="f-rotated" viewBox="0 0 400 120"><line class="vec" x1="20" y1="40" x2="100" y2="40"/><text x="60" y="60" transform="rotate(-90 60 60)">velocity</text></svg>
<svg class="f-subscript" viewBox="0 0 400 120"><line class="vec" x1="20" y1="69" x2="300" y2="69"/><text x="100" y="60">v<tspan dy="8" font-size="10">f</tspan></text></svg>
<svg class="f-head" viewBox="0 0 400 120"><line class="vec" x1="20" y1="90" x2="200" y2="90" marker-end="url(#ah)"/><text x="203" y="96">a</text></svg>
<svg class="f-ok" viewBox="0 0 400 120"><line class="vec" x1="20" y1="55" x2="300" y2="55"/><text x="100" y="60" data-pf-ok="">v</text></svg>
<svg class="f-grid" viewBox="0 0 400 120"><line class="gl" x1="10" y1="55" x2="390" y2="55"/><text x="100" y="60">v</text></svg>
<svg class="f-role-axis" viewBox="0 0 400 120"><line class="vec" x1="20" y1="55" x2="150" y2="55" data-pf-role="axis"/><text x="100" y="60">v</text></svg>
<svg class="f-tick" viewBox="0 0 400 120"><line class="gl" x1="100" y1="50" x2="100" y2="56"/><text x="97" y="62">0</text></svg>
</body></html>
