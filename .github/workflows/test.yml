name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run pytest -q
        env:
          PRINTFIT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PRINTFIT_NO_SANDBOX: "1"
