name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays: catch advisories published since the last push
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Secrets in history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Known-vulnerable Python deps (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/req.txt"
